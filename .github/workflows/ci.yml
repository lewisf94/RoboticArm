name: ci

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Cache PlatformIO
        uses: actions/cache@v4
        with:
          path: |
            ~/.platformio
            ~/.cache/pip
          key: pio-${{ runner.os }}-${{ hashFiles('platformio.ini') }}

      - name: Install PlatformIO
        run: pip install platformio

      - name: Core unit tests (native)
        run: pio test -e native

      - name: Firmware build (esp32s3)
        run: pio run -e esp32s3

  ros2:
    runs-on: ubuntu-latest
    container: ros:jazzy-ros-base
    steps:
      - uses: actions/checkout@v4

      - name: Install ROS 2 build + URDF tools
        run: |
          apt-get update
          apt-get install -y --no-install-recommends \
            python3-colcon-common-extensions \
            liburdfdom-tools \
            ros-jazzy-xacro
          rm -rf /var/lib/apt/lists/*

      - name: colcon build
        shell: bash
        run: |
          source /opt/ros/jazzy/setup.bash
          cd ros2
          colcon build

      - name: Expand xacro and validate URDF
        shell: bash
        run: |
          source /opt/ros/jazzy/setup.bash
          source ros2/install/setup.bash
          xacro ros2/arm_description/urdf/bench_arm.urdf.xacro > /tmp/bench_arm.urdf
          check_urdf /tmp/bench_arm.urdf
