<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>RoboArm</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<header class="bar">
  <span id="dot" class="dot" title="disconnected"></span>
  <span id="profile-name" class="profile-name">RoboArm</span>
  <span id="wifi" class="wifi">–</span>
  <label class="enable-toggle" title="Enable">
    <input type="checkbox" id="enable-toggle" aria-label="Enable" disabled>
  </label>
  <button id="estop" class="estop" type="button">E-STOP</button>
</header>

<main id="joints">
  <p id="joints-placeholder" class="joints-placeholder">disconnected — retrying…</p>
</main>

<details class="trims">
  <summary>Trims</summary>
  <div id="trim-rows"></div>
</details>

<div id="toasts" class="toasts" aria-live="polite"></div>

<script type="module" src="js/app.js"></script>
</body>
</html>
