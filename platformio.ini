; RoboticArm — ESP32-S3 robot arm controller
; Two build targets:
;   esp32s3 : firmware for the ESP32-S3 DevKitC-1 (Arduino framework)
;   native  : host build of lib/arm_core unit tests (no hardware needed)
;
; Common commands:
;   pio test -e native          # run core unit tests on this machine
;   pio run  -e esp32s3         # compile firmware
;   pio run  -e esp32s3 -t upload    # flash (hardware attached only)
;   pio run  -e esp32s3 -t uploadfs  # flash LittleFS image from data/ (web UI)

[platformio]
default_envs = esp32s3

[env]
build_flags = -Wall -Wextra

[env:esp32s3]
platform = espressif32@^6.12.0
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200
board_build.filesystem = littlefs
build_unflags = -std=gnu++11
build_flags =
    ${env.build_flags}
    -std=gnu++17
    ; Route Serial to the native USB port (works on single-USB clone boards too)
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1
lib_deps =
    bblanchon/ArduinoJson@^7
    mathieucarbou/ESPAsyncWebServer@^3
    mathieucarbou/AsyncTCP@^3

[env:native]
platform = native
test_framework = unity
build_flags =
    ${env.build_flags}
    -std=gnu++17
    -DARM_CORE_NATIVE
lib_deps =
    bblanchon/ArduinoJson@^7
